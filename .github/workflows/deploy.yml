name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels any in-flight deploy
# rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint i18n locale files
        run: npm run lint:i18n

      - name: Type-check and build
        run: npm run build

      # GitHub Pages is a static file server with no SPA rewrite rule, so a hard
      # navigation to a client-side route (e.g. /einbuergerungstest/settings, or
      # any bookmarked deep link) would 404 on a first visit — before the service
      # worker exists to serve `navigateFallback`. Pages serves `404.html` for
      # every unmatched path, so shipping the app shell under that name turns the
      # 404 into the router's own entry point.
      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
